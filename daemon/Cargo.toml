[package]
name = "sorakey"
version = "0.1.1"
edition = "2024"
description = "Lean mechanical keyboard sound daemon. Forked from the MechvibesDX core (v0.8.2), stripped of all GUI, with a Unix-socket control API."
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
evdev = "0.13"
directories = "6.0.0"
hound = "3.5"
libc = "0.2"
rodio = "0.20.1"
cpal = "0.15"
rubato = "0.15"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.140"
symphonia = { version = "0.5", features = ["mp3", "wav", "ogg", "isomp4", "aac"] }

[profile.dev]
opt-level = 2
debug = true