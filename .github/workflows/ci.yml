name: sorakey-ci
# The missing gate that let a compile error reach a release tag: every push
# and PR runs the same test + lint + format suite the release requires.
on:
  push:
    branches: ["main"]
    # Compiled inputs only (mirrors release.yml): QML/JS/docs/scripts ship
    # straight from the git clone, so running cargo here on a widget tweak
    # burns ~3-5 billed min for zero signal. Add any NEW compiled input's
    # path here or its pushes silently skip CI.
    paths: ["daemon/**", "rust-toolchain.toml", "daemon/Cargo.lock", ".github/workflows/ci.yml"]
  pull_request:
    branches: ["main"]
    paths: ["daemon/**", "rust-toolchain.toml", "daemon/Cargo.lock", ".github/workflows/ci.yml"]
# Burst pushes cancel the queued run — only the newest commit is checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.87"
          components: rustfmt, clippy
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libevdev-dev libxtst-dev libxi-dev pkg-config
      - name: Test + lint + format (same gate as the release)
        run: |
          cargo test --locked --manifest-path daemon/Cargo.toml
          cargo clippy --locked --manifest-path daemon/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path daemon/Cargo.toml -- --check
